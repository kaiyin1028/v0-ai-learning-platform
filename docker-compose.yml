version: '3.8'

services:
  # PostgreSQL 資料庫
  db:
    image: postgres:15-alpine
    container_name: learnai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: learnai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-learnai_secure_password}
      POSTGRES_DB: learnai_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/001_init_database.sql:/docker-entrypoint-initdb.d/001_init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnai -d learnai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LearnAI 應用程式
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learnai-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://learnai:${DB_PASSWORD:-learnai_secure_password}@db:5432/learnai_db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # Redis 快取 (可選)
  redis:
    image: redis:7-alpine
    container_name: learnai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
